{% load widget_tweaks %}
<div class="{{ wrapper_class|default:'' }}">
  {% if field.field.widget.input_type != 'checkbox' %}
    <label for="{{ field.id_for_label }}" class="mb-1.5 block text-[11px] uppercase tracking-luxe text-paper/45">
      {{ field.label }}{% if field.field.required %} <span class="text-gold">*</span>{% endif %}
    </label>
    {{ field }}
  {% else %}
    <label class="flex items-start gap-3 text-sm text-paper/70">
      {{ field }}
      <span>{{ field.label }}{% if field.field.required %} <span class="text-gold">*</span>{% endif %}</span>
    </label>
  {% endif %}
  {% if field.help_text %}<p class="mt-1.5 text-xs text-paper/40">{{ field.help_text }}</p>{% endif %}
  {% for error in field.errors %}<p class="mt-1.5 text-xs text-rose-400">{{ error }}</p>{% endfor %}
</div>
