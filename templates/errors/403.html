{% extends "base.html" %}
{% block title %}Access denied &middot; {{ BRAND_NAME }}{% endblock %}
{% block content %}
<section class="mx-auto flex min-h-[70vh] max-w-3xl flex-col items-center justify-center px-6 text-center">
  <p class="text-[11px] uppercase tracking-luxe text-gold">Error 403</p>
  <h1 class="mt-6 font-display text-6xl leading-none lg:text-8xl">Private</h1>

{% endblock %}
