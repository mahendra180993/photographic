<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Back shortly &middot; {{ site.site_name }}</title>
  <link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=clash-display@400,600&f[]=general-sans@400&display=swap">
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="grid min-h-screen place-items-center bg-[#0B0B0C] px-6 text-center text-[#F6F5F2]" style="font-family:'General Sans',sans-serif">
  <div>
    <p class="text-[11px] uppercase tracking-[0.3em] text-[#D4AF37]">{{ site.site_name }}</p>
    <h1 class="mt-6 text-5xl md:text-7xl" style="font-family:'Clash Display',serif">Back shortly</h1>
    <p class="mx-auto mt-6 max-w-md text-white/60">{{ site.maintenance_message }}</p>
    <p class="mt-10 text-sm text-white/40">{{ site.contact_email }}</p>
  </div>
</body>
</html>
