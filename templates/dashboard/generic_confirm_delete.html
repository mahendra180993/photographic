{% extends "dashboard/base.html" %}

{% block content %}
<div class="mx-auto max-w-lg">
  <div class="dash-card p-8 text-center">
    <span class="mx-auto grid h-14 w-14 place-items-center rounded-full bg-rose-50 text-2xl text-rose-500">!</span>
    <h2 class="mt-6 font-display text-2xl">Delete this record?</h2>
    <p class="mt-3 text-sm text-slate-500">
      You are about to permanently delete <strong class="text-slate-700">{{ object }}</strong>.
      Related files and history will be removed too. This cannot be undone.
    </p>

    <form method="post" class="mt-8 flex justify-center gap-3">
      {% csrf_token %}
      <button type="submit" class="rounded-lg bg-rose-600 px-5 py-2.5 text-sm font-medium text-white hover:bg-rose-700">Yes, delete</button>
      <a href="{{ request.META.HTTP_REFERER|default:'/studio/' }}" class="rounded-lg border border-slate-200 px-5 py-2.5 text-sm text-slate-600">Cancel</a>
    </form>
  </div>
</div>
{% endblock %}
