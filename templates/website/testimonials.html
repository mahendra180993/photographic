{% extends "base.html" %}

{% block content %}
<section class="mx-auto max-w-[1400px] px-6 pb-16 pt-16 lg:px-12">
  <p class="eyebrow" data-reveal>Testimonials</p>
  <h1 class="mt-6 display-xl text-[clamp(2.6rem,9vw,8rem)]" data-reveal>Kind words</h1>
</section>

<section class="mx-auto max-w-[1400px] px-6 pb-28 lg:px-12">
  <div class="columns-1 gap-6 lg:columns-2 [&>*]:mb-6" data-stagger>
    {% for testimonial in testimonials %}
      <figure class="break-inside-avoid rounded-sm border border-gold/15 bg-surface p-8">
        <div class="flex gap-1 text-gold">
          {% for star in testimonial.star_range %}<span>&#9733;</span>{% endfor %}
        </div>
        <blockquote class="mt-6 font-display text-xl leading-snug lg:text-2xl">&ldquo;{{ testimonial.quote }}&rdquo;</blockquote>
        <figcaption class="mt-7 flex items-center gap-4 border-t border-white/10 pt-5">
          {% if testimonial.photo %}
            <img src="{{ testimonial.photo.url }}" alt="{{ testimonial.author_name }}" class="h-11 w-11 rounded-full object-cover">
          {% else %}
            <span class="grid h-11 w-11 place-items-center rounded-full bg-slateink font-display text-sm text-paper/50">{{ testimonial.author_name|slice:":1" }}</span>
          {% endif %}
          <div>
            <p class="text-sm font-medium">{{ testimonial.author_name }}</p>
            <p class="text-[11px] uppercase tracking-luxe text-paper/40">{{ testimonial.author_role }}{% if testimonial.location %} &middot; {{ testimonial.location }}{% endif %}</p>
          </div>
        </figcaption>
      </figure>
    {% empty %}
      <p class="text-paper/50">Testimonials will appear here soon.</p>
    {% endfor %}
  </div>
</section>
{% endblock %}
