{% extends "accounts/_auth_base.html" %}

{% block auth_content %}
  <p class="eyebrow">Password</p>
  <h1 class="mt-4 font-display text-4xl">Reset your password</h1>
  <p class="mt-3 text-sm text-paper/55">Enter the email on your account and we will send a reset link.</p>

  <form method="post" class="site-form mt-10 space-y-5" novalidate>
    {% csrf_token %}
    {% include "partials/field.html" with field=form.email %}
    <button type="submit" class="btn-gold w-full">Send reset link</button>
  </form>

  <p class="mt-8 text-center text-xs text-paper/45">
    <a href="{% url 'accounts:client_login' %}" class="hover:text-gold">Back to sign in</a>
  </p>
{% endblock %}
