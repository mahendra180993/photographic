{% extends "accounts/_auth_base.html" %}

{% block auth_content %}
  <p class="eyebrow">Check your inbox</p>
  <h1 class="mt-4 font-display text-4xl">Link sent</h1>
  <p class="mt-4 text-sm leading-relaxed text-paper/55">
    If an account exists for that address, a password reset link is on its way.
    In development the email is printed to the server console.
  </p>
  <a href="{% url 'accounts:client_login' %}" class="btn-gold mt-10">Back to sign in</a>
{% endblock %}
