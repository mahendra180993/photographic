# Optional Django backend for Netlify (or standalone) deployment.
# Connect this repo on https://render.com and Render will provision Postgres + web.

services:
  - type: web
    name: lumina-atelier
    runtime: docker
    plan: free
    healthCheckPath: /health/
    envVars:
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: lumina-db
          property: connectionString
      - key: DJANGO_ALLOWED_HOSTS
        value: ".onrender.com,.netlify.app"
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
      - key: SITE_DOMAIN
        sync: false
      - key: SECURE_SSL_REDIRECT
        value: "True"
      - key: SESSION_COOKIE_SECURE
        value: "True"
      - key: CSRF_COOKIE_SECURE
        value: "True"

databases:
  - name: lumina-db
    plan: free
    databaseName: lumina
    user: lumina
